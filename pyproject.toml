[project]
name = "aivoice2-gui-bridge"
version = "0.1.0"
description = "Local GUI automation bridge for A.I.VOICE2 Editor."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "opencv-python>=4.8",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "pyyaml>=6.0",
]

[project.scripts]
aivoice2-gui-bridge = "aivoice2_gui_bridge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
